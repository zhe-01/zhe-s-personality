<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的主页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body{background:#f4f4f4;padding:40px 20px}
        .card{max-width:420px;margin:0 auto;background:#fff;border-radius:16px;padding:32px;text-align:center}
        .avatar{width:90px;height:90px;border-radius:50%;object-fit:cover;margin-bottom:16px}
        .name{font-size:22px;font-weight:600;margin-bottom:8px}
        .desc{color:#666;margin-bottom:28px}
        a.link{display:block;text-decoration:none;color:#222;border:1px solid #ddd;border-radius:12px;padding:14px;margin-bottom:12px;transition:0.2s}
        a.link:hover{background:#f0f0f0}
    </style>
</head>
<body>
    <div class="card">
        <img class="avatar" src="头像图片链接">
        <div class="name">你的名字</div>
        <div class="desc">随便记录一点兴趣和日常</div>
        <a class="link" href="https://github.com/xxx">GitHub</a>
        <a class="link" href="B站链接">B站</a>
        <a class="link" href="你的笔记地址">读书笔记</a>
    </div>
</body>
</html>
